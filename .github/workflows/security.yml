name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"     # weekly, Monday 05:17 SAST: catch new advisories in unchanged code

permissions:
  contents: read

jobs:
  dependencies:
    name: Known vulnerabilities in dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-cloud.txt --progress-spinner off

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
