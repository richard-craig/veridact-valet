name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    # Dependabot's commits cannot carry a DCO sign-off; its pull requests are still reviewed before merging.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $sha has no Signed-off-by line. See CONTRIBUTING.md (Sign your commits)."
              missing=1
            fi
          done
          exit $missing
