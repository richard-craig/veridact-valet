        type: account_information
        action: read_transactions_detail
        resource: { resource_type: account, resource_id: acc_Zp41Qm9Tt2 }
        context: { resource_server: accounts-api, endpoint: 'GET /accounts/{id}/transactions' }
    DecisionRequestPayment:
      summary: Agent-initiated transfer, reserve the amount
      value:
        consent_id: cns_T7yU3iO9pA2sD5fG8hJ1kL
        client_id: acme-budgeting-prod
        actor_id: did:web:agents.acme.example:budget-assistant
        type: delegated_action
        action: transfer_between_own_accounts
        resource: { resource_type: account, resource_id: acc_Zp41Qm9Tt2 }
        amount: { amount: '1500.00', currency: ZAR }
        reserve: true
    DecisionPermit:
      value:
        decision: permit
        reason: ok
        cache_ttl_seconds: 30
        constraints:
          transactions_from: '2026-05-01T00:00:00+02:00'
          transactions_to: '2026-11-10T23:59:59+02:00'
    DecisionDenyLimit:
      value:
        decision: deny
        reason: limit_exceeded
        cache_ttl_seconds: 0
    EventRevoked:
      summary: Customer revoked from the bank's dashboard
      value:
        iss: https://consent.bank.example
        iat: 1794300000
        jti: evt_4b1f0c9e
        aud: acme-budgeting-prod
        events:
          https://schemas.bank.example/events/consent/status_changed:
            consent_id: cns_8Fq2LkT0vR5wXc1YzA7bN3
            status: Revoked
            previous_status: Authorised
            status_reason: revoked_by_customer
            changed_at: '2026-12-02T18:21:07+02:00'
    ProblemExpiryTooLong:
      value:
        type: https://errors.bank.example/consent/expiry-exceeds-max
        title: Consent expiry exceeds the maximum for this type
        status: 422
        detail: account_information consents may last at most 12 months (P12M).
        error_code: expiry_exceeds_max
        errors:
          - pointer: /expires_at
            message: Must be on or before 2027-11-10T09:00:00+02:00
        interaction_id: 3f1c2a9e-6b7d-4c1a-9f2e-8d5b7a6c4e21
